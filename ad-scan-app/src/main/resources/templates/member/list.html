<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${appName} + ' — Adhérents'">Adhérents</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <div class="actions-bar">
        <h2>Adhérents</h2>
        <a class="btn" th:href="@{/members/new}">+ Ajouter un adhérent</a>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Email</th>
                <th>Provenance</th>
                <th>Début</th>
                <th>Fin</th>
                <th>Statut</th>
                <th>Créé le</th>
                <th>Détails</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member : ${members}">
                <td th:text="${member.firstName}"></td>
                <td th:text="${member.lastName}"></td>
                <td th:text="${member.email}"></td>
                <td th:text="${member.provenance()}"></td>
                <td th:text="${member.startDate}"></td>
                <td th:text="${member.endDate}"></td>
                <td>
                    <span th:if="${member.confirmed}" class="status-badge ok">Cotisant</span>
                    <span th:unless="${member.confirmed}" class="status-badge warn">Non cotisant</span>
                </td>
                <td th:text="${member.createdAt}"></td>
                <td><a class="btn" th:href="@{/members/{id}(id=${member.id})}">Détails</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="9">Aucun adhérent pour le moment.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
