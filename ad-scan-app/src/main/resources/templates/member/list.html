<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${appName} + ' — Adhérents'">Adhérents</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <div class="actions-bar">
        <h2>Adhérents</h2>
        <a class="btn" th:href="@{/members/new}">+ Ajouter un adhérent</a>
    </div>
    <ul class="member-list">
        <li th:each="member : ${members}">
            <a class="member-list-name" th:href="@{/members/{id}(id=${member.id})}"
               th:text="${member.firstName} + ' ' + ${member.lastName}"></a>
            <span th:if="${member.confirmed}" class="status-badge ok">Cotisant</span>
            <span th:unless="${member.confirmed}" class="status-badge warn">Non cotisant</span>
            <form method="post" th:action="@{/members/{id}/delete(id=${member.id})}"
                  th:attr="onsubmit=|return confirm('Supprimer définitivement ${#strings.escapeJavaScript(member.firstName + ' ' + member.lastName)} ? Cette action est irréversible.');|">
                <button type="submit" class="btn btn-danger btn-small">Supprimer</button>
            </form>
        </li>
        <li th:if="${#lists.isEmpty(members)}" class="member-list-empty">Aucun adhérent pour le moment.</li>
    </ul>
</main>
</body>
</html>
