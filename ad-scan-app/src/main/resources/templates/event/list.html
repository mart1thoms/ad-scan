<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${appName} + ' — Événements'">Événements</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <div class="actions-bar">
        <h2>Événements</h2>
        <a class="btn" th:href="@{/events/new}">+ Créer un événement</a>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Date</th>
                <th>Scan</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.id}"></td>
                <td><a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.name}"></a></td>
                <td th:text="${event.eventDate}"></td>
                <td><a th:href="@{/events/{id}/scan(id=${event.id})}">Scanner les entrées</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(events)}">
                <td colspan="4">Aucun événement pour le moment.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
