<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${appName} + ' — Connexion'">Connexion</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="login-card">
    <h1 th:text="${appName}">BDE</h1>
    <p th:if="${param.error}" class="error-banner">Mot de passe incorrect.</p>
    <p th:if="${param.logout}" class="error-banner" style="background:#eaf7ec;color:#1e7d32;border-color:#c6e8cb;">Déconnecté.</p>
    <form th:action="@{/login}" method="post" class="form-card">
        <label for="username">Utilisateur</label>
        <input type="hidden" id="username" name="username" value="admin"/>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autofocus="autofocus"/>
        <button type="submit" class="btn">Se connecter</button>
    </form>
</div>
</body>
</html>
